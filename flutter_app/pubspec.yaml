name: tichu_online
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.1+47

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  connectivity_plus: ^6.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.3.5
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  kakao_flutter_sdk_user: ^1.9.7
  kakao_flutter_sdk_share: ^1.10.0
  crypto: ^3.0.6
  firebase_messaging: ^15.2.4
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  audioplayers: ^6.1.0
  google_mobile_ads: ^5.3.0
  app_tracking_transparency: ^2.0.6
  app_links: ^6.4.1
  url_launcher: ^6.3.2
  firebase_analytics: ^11.6.0
  in_app_purchase: ^3.3.0
  # Direct dep so iap_service.dart can import InAppPurchaseAndroidPlatformAddition
  # for manual consumePurchase (autoConsume=false flow). Pulled in transitively
  # by in_app_purchase anyway; pinning it explicitly avoids a "unknown package"
  # surprise on a strict resolver.
  # 0.5.x bundles Google Play Billing Library 8.x (required by Play from
  # 2026-08-31; 0.4.x shipped Billing 7.x). Requires Dart >= 3.12.
  in_app_purchase_android: ^0.5.2
  # Profile-photo UGC (2.8.0): pick from gallery, upload via HTTP multipart to
  # https://tichu.jiny.shop/upload/profile-photo, display cached network avatars.
  # The app is otherwise WS-only, so these are the first http/image deps.
  # Crop output is encoded here rather than by dart:ui, which only writes PNG.
  # A 512² PNG of a photo runs ~700KB; the same frame as JPEG is ~55KB, and the
  # server re-encodes to JPEG anyway — so the PNG was pure upload cost.
  # Pure Dart, no platform channel.
  image: ^4.2.0
  image_picker: ^1.1.2
  # Direct deps only so the Android system photo picker can be switched on
  # (ImagePickerAndroid.useAndroidPhotoPicker) — image_picker itself exposes no
  # way to do it. Versions follow whatever image_picker already resolves to.
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0
  http: ^1.2.2
  http_parser: ^4.0.2 # MediaType for the multipart upload Content-Type
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  # Adaptive icon (Android 8+). Without these the launcher had only the square
  # ic_launcher.png to work with and drew it inside its mask — a square picture
  # in a circle, with the corners cut. Android also guarantees just the middle
  # 72 of 108dp, so the full-bleed art lost the wordmark entirely; the
  # foreground here is that art scaled into the safe zone, over the sky colour
  # sampled from it. Regenerate with:  dart run flutter_launcher_icons
  adaptive_icon_background: "#2F6FD0"
  adaptive_icon_foreground: "assets_src/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # WebP throughout. These are photographic card illustrations, and as PNG they
  # came to 16.5MB — fine on a phone where they load off local storage, ruinous
  # on the web where every one is an HTTP download (the login screen alone
  # pulled a 1.4MB dragonIcon over 2.7s). At q90 the same art is 2.4MB with no
  # visible difference at the sizes they render, and the mobile bundle gets
  # ~14MB smaller as a side effect.
  #
  # assets/icon.png stays on disk as flutter_launcher_icons' source — that tool
  # reads the path directly, so it does not need to be bundled — but is no
  # longer shipped; the 80x80 runtime use reads assets/icon.webp.
  # assets/logo.png was referenced from nowhere and is gone entirely.
  assets:
    - assets/cards/
    - assets/sfx/
    - assets/icons/
    - assets/bots/
    - assets/icon.webp
    - assets/logo2.webp
    - assets/splash.webp
    - assets/dragonIcon.webp

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
