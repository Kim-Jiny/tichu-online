<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="티츄, 스컬킹, 러브레터, 마이티를 즐기는 멀티플레이 카드게임">

  <!-- No maximum-scale / user-scalable=no here on purpose. Locking zoom is
       tempting because the board is laid out to the viewport, but on iOS it
       interacts with how Safari brings a focused field into view, and that is
       exactly the area where the on-screen keyboard is currently misbehaving.
       Not worth carrying an extra variable through that. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="티츄 온라인">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. 64px rather than the usual 32: browsers render tab icons at
       device pixel ratio, and the source art has enough detail to be worth it.
       The 1024 original lives in docs/brand/ — it must not sit under
       flutter_app/assets/, which pubspec bundles into the mobile app. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>티츄 온라인</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Let text fields be selectable again.

      Flutter puts `user-select: none` on its whole view so a drag across the
      board doesn't select the UI as if it were a document — but the rule also
      lands on the <input> elements the semantics tree creates for TextFields,
      and iOS Safari will not raise its on-screen keyboard for an input it
      considers unselectable. The field focused, drew a caret, and no keyboard
      ever came up. Android ignores the rule, which is why this only ever
      showed on iOS.

      Scoped to the inputs themselves so the rest of the app keeps its
      no-selection behaviour.
    */
    flt-semantics input,
    flt-semantics textarea,
    input,
    textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      /* Under 16px iOS zooms the page on focus; the field is drawn by Flutter
         underneath anyway, so this text is never actually seen. */
      font-size: 16px;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
