<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="티츄(Tichu), 마이티(Mighty), 스컬킹(Skull King), 러브레터(Love Letter)를 친구들과 온라인으로. 설치 없이 브라우저에서 바로 시작하는 멀티플레이 카드게임.">

  <!-- Naver Search Advisor ownership. The file-upload method works too, but a
       meta tag rides along in the bundle instead of being one more artefact to
       remember on the next web build. Naver re-reads it, so it stays. -->
  <meta name="naver-site-verification" content="a4af4c9d76254cf12a9894bc6c6e0dfc8996a61a" />

  <!-- Safari's Smart App Banner. A meta tag, NOT a universal link: it draws a
       dismissible bar at the top of the page offering to open the app, and
       leaves the page itself alone. Universal links would do the opposite —
       intercept the URL before the browser ever renders it — which is why the
       app-link scope stays limited to /invite. This site IS the game now; a
       phone with the app installed must still be able to open it in a
       browser. -->
  <meta name="apple-itunes-app" content="app-id=6759035151">

  <!-- Open Graph / Twitter. This used to come from the server-rendered
       marketing page at '/', which the web client has now replaced. A crawler
       cannot read a Flutter canvas, so without these a shared link would
       preview as a blank card with no title. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tichu Online">
  <meta property="og:title" content="Tichu Online — 친구들과 카드 한 판">
  <meta property="og:description" content="티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임. 설치 없이 브라우저에서 바로 시작하세요.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tichu Online — 친구들과 카드 한 판">
  <meta name="twitter:description" content="티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임.">

  <!-- No maximum-scale / user-scalable=no here on purpose. Locking zoom is
       tempting because the board is laid out to the viewport, but on iOS it
       interacts with how Safari brings a focused field into view, and that is
       exactly the area where the on-screen keyboard is currently misbehaving.
       Not worth carrying an extra variable through that. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="티츄 온라인">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. 64px rather than the usual 32: browsers render tab icons at
       device pixel ratio, and the source art has enough detail to be worth it.
       The 1024 original lives in docs/brand/ — it must not sit under
       flutter_app/assets/, which pubspec bundles into the mobile app. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>Tichu Online — 티츄 · 마이티 · 스컬킹 · 러브레터 멀티플레이 카드게임</title>

  <!-- One address for one page. tichu.jiny.shop answers with this same app
       (it has to: older app binaries have that host compiled in — see
       docs/DOMAIN_MIGRATION.md), so without this a search engine sees two
       competing copies and splits whatever ranking they earn between them.
       tichu.kr is the one to keep. -->
  <link rel="canonical" href="https://tichu.kr/">
  <meta property="og:url" content="https://tichu.kr/">
  <link rel="manifest" href="manifest.json">

  <!-- Structured data, so a search result can show the game rather than a
       bare URL. Kept minimal and factual. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Tichu Online",
    "alternateName": ["티츄 온라인", "티츄", "Tichu"],
    "url": "https://tichu.kr/",
    "inLanguage": "ko",
    "genre": "카드게임",
    "gamePlatform": ["Web", "Android", "iOS"],
    "playMode": "MultiPlayer",
    "applicationCategory": "Game",
    "operatingSystem": "Web, Android, iOS",
    "description": "티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임.",
    "keywords": "티츄, 티츄 온라인, Tichu, 마이티, 마이티 게임, 스컬킹, Skull King, 러브레터, Love Letter, 온라인 카드게임, 멀티플레이 카드게임",
    "gameItem": [
      { "@type": "Thing", "name": "티츄", "alternateName": "Tichu" },
      { "@type": "Thing", "name": "마이티", "alternateName": "Mighty" },
      { "@type": "Thing", "name": "스컬킹", "alternateName": "Skull King" },
      { "@type": "Thing", "name": "러브레터", "alternateName": "Love Letter" }
    ]
  }
  </script>

  <style>
    /*
      Let text fields be selectable again.

      Flutter puts `user-select: none` on its whole view so a drag across the
      board doesn't select the UI as if it were a document — but the rule also
      lands on the <input> elements the semantics tree creates for TextFields,
      and iOS Safari will not raise its on-screen keyboard for an input it
      considers unselectable. The field focused, drew a caret, and no keyboard
      ever came up. Android ignores the rule, which is why this only ever
      showed on iOS.

      Scoped to the inputs themselves so the rest of the app keeps its
      no-selection behaviour.
    */
    flt-semantics input,
    flt-semantics textarea,
    input,
    textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      /* Under 16px iOS zooms the page on focus; the field is drawn by Flutter
         underneath anyway, so this text is never actually seen. */
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- The only text on this page. Everything else is drawn into a canvas by
       Flutter, which a crawler can render but cannot read as prose, so a
       search for 티츄 had no words here to match. Hidden from sight, not from
       crawlers — it duplicates what the game itself says on screen. -->
  <div id="seo-copy" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">
    <h1>티츄 온라인 (Tichu Online)</h1>
    <p>
      티츄(Tichu), 마이티(Mighty), 스컬킹(Skull King), 러브레터(Love Letter)를
      친구들과 함께 즐기는 온라인 멀티플레이 카드게임입니다. 설치 없이
      브라우저에서 바로 플레이할 수 있고, 안드로이드와 iOS 앱도 있습니다.
      랭크전, 봇 대전, 관전, 채팅을 지원합니다.
    </p>
    <h2>지원 게임</h2>
    <ul>
      <li>티츄 — 4인 2:2 팀 카드게임</li>
      <li>마이티 — 5인 트릭테이킹 카드게임</li>
      <li>스컬킹 — 최대 6인 예측 트릭테이킹 게임</li>
      <li>러브레터 — 2~4인 추리 카드게임</li>
    </ul>
  </div>

  <script>
    // Built with --pwa-strategy=none, but a browser that visited an earlier
    // build still has that service worker registered and will keep serving its
    // cached bundle — which looks exactly like "the fix didn't deploy". Drop
    // any registration and its caches once, on load.
    //
    // Offline play is not a goal here: every screen needs the WebSocket, so a
    // cached shell would only ever show a disconnected app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <!-- Visible only when the app cannot run (crawlers, JS disabled). Flutter
       replaces the body content once it boots, so this never shows to a real
       player. -->
  <noscript>
    <div style="max-width:38rem;margin:3rem auto;padding:0 1.5rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.7;color:#143a57">
      <h1>Tichu Online</h1>
      <p>티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임입니다.
         브라우저에서 바로 플레이하려면 자바스크립트를 켜주세요.</p>
      <p>
        <a href="https://play.google.com/store/apps/details?id=com.jiny.tichuOnline">Google Play</a> ·
        <a href="https://apps.apple.com/app/tichu-online/id6759035151">App Store</a>
      </p>
    </div>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
