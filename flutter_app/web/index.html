<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="티츄(Tichu), 마이티(Mighty), 스컬킹(Skull King), 러브레터(Love Letter)를 친구들과 온라인으로. 설치 없이 브라우저에서 바로 시작하는 멀티플레이 카드게임.">

  <!-- Naver Search Advisor ownership. The file-upload method works too, but a
       meta tag rides along in the bundle instead of being one more artefact to
       remember on the next web build. Naver re-reads it, so it stays. -->
  <meta name="naver-site-verification" content="a4af4c9d76254cf12a9894bc6c6e0dfc8996a61a" />

  <!-- Safari's Smart App Banner. A meta tag, NOT a universal link: it draws a
       dismissible bar at the top of the page offering to open the app, and
       leaves the page itself alone. Universal links would do the opposite —
       intercept the URL before the browser ever renders it — which is why the
       app-link scope stays limited to /invite. This site IS the game now; a
       phone with the app installed must still be able to open it in a
       browser. -->
  <meta name="apple-itunes-app" content="app-id=6759035151">

  <!-- Open Graph / Twitter. This used to come from the server-rendered
       marketing page at '/', which the web client has now replaced. A crawler
       cannot read a Flutter canvas, so without these a shared link would
       preview as a blank card with no title. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tichu Online">
  <meta property="og:title" content="Tichu Online — 친구들과 카드 한 판">
  <meta property="og:description" content="티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임. 설치 없이 브라우저에서 바로 시작하세요.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tichu Online — 친구들과 카드 한 판">
  <meta name="twitter:description" content="티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임.">

  <!-- No maximum-scale / user-scalable=no here on purpose. Locking zoom is
       tempting because the board is laid out to the viewport, but on iOS it
       interacts with how Safari brings a focused field into view, and that is
       exactly the area where the on-screen keyboard is currently misbehaving.
       Not worth carrying an extra variable through that. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="티츄 온라인">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon. 64px rather than the usual 32: browsers render tab icons at
       device pixel ratio, and the source art has enough detail to be worth it.
       The 1024 original lives in docs/brand/ — it must not sit under
       flutter_app/assets/, which pubspec bundles into the mobile app. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>Tichu Online — 티츄 · 마이티 · 스컬킹 · 러브레터 멀티플레이 카드게임</title>

  <!-- One address for one page. tichu.jiny.shop answers with this same app
       (it has to: older app binaries have that host compiled in — see
       docs/DOMAIN_MIGRATION.md), so without this a search engine sees two
       competing copies and splits whatever ranking they earn between them.
       tichu.kr is the one to keep. -->
  <link rel="canonical" href="https://tichu.kr/">
  <meta property="og:url" content="https://tichu.kr/">
  <link rel="manifest" href="manifest.json">

  <!-- 부팅 경로의 큰 파일을 미리 건다.
       그냥 두면 왕복이 줄줄이 이어진다 — 브라우저는 flutter_bootstrap.js 를
       받아서 실행한 뒤에야 main.dart.js 를 요청하고, Pretendard 는 그
       main.dart.js 가 다 내려와 main() 이 돌기 시작해야 요청된다. RTT 300ms
       짜리 회선에서 실측하면 첫 프레임까지 5.3초였고 그중 1초가 이 대기였다.
       미리 걸어 두면 셋이 0초부터 같이 내려온다.

       Pretendard 는 as="font" 가 아니라 as="fetch" 다 — main.dart.js 의
       FontLoader 가 CSS @font-face 가 아니라 http 로 바이트를 직접 읽어
       CanvasKit 에 등록하기 때문이다. crossorigin 을 붙이면 같은 출처
       XHR(자격증명 same-origin)과 모드가 어긋나 두 번 받는다. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="fonts/Pretendard-Regular.woff2" as="fetch" type="font/woff2">
  <link rel="preload" href="fonts/Pretendard-Bold.woff2" as="fetch" type="font/woff2">

  <!-- Structured data, so a search result can show the game rather than a
       bare URL. Kept minimal and factual. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Tichu Online",
    "alternateName": ["티츄 온라인", "티츄", "Tichu"],
    "url": "https://tichu.kr/",
    "inLanguage": "ko",
    "genre": "카드게임",
    "gamePlatform": ["Web", "Android", "iOS"],
    "playMode": "MultiPlayer",
    "applicationCategory": "Game",
    "operatingSystem": "Web, Android, iOS",
    "description": "티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임.",
    "keywords": "티츄, 티츄 온라인, Tichu, 마이티, 마이티 게임, 스컬킹, Skull King, 러브레터, Love Letter, 온라인 카드게임, 멀티플레이 카드게임",
    "gameItem": [
      { "@type": "Thing", "name": "티츄", "alternateName": "Tichu" },
      { "@type": "Thing", "name": "마이티", "alternateName": "Mighty" },
      { "@type": "Thing", "name": "스컬킹", "alternateName": "Skull King" },
      { "@type": "Thing", "name": "러브레터", "alternateName": "Love Letter" }
    ]
  }
  </script>

  <style>
    /*
      Let text fields be selectable again.

      Flutter puts `user-select: none` on its whole view so a drag across the
      board doesn't select the UI as if it were a document — but the rule also
      lands on the <input> elements the semantics tree creates for TextFields,
      and iOS Safari will not raise its on-screen keyboard for an input it
      considers unselectable. The field focused, drew a caret, and no keyboard
      ever came up. Android ignores the rule, which is why this only ever
      showed on iOS.

      Scoped to the inputs themselves so the rest of the app keeps its
      no-selection behaviour.
    */
    flt-semantics input,
    flt-semantics textarea,
    input,
    textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      /* Under 16px iOS zooms the page on focus; the field is drawn by Flutter
         underneath anyway, so this text is never actually seen. */
      font-size: 16px;
    }

    /*
      부팅 중에 보여 줄 화면.

      Flutter 가 첫 프레임을 그리기 전까지 이 페이지에는 아무것도 없다. 회선이
      느리면 그 백지가 몇 초씩 이어지고, 사용자 눈에는 "안 뜨는 사이트"다.
      실제 다운로드가 빨라지는 건 아니지만, 기다리는 동안 무엇을 기다리는지는
      보여야 한다.

      웹폰트를 쓰지 않는다 — 이 화면의 존재 이유가 "즉시 뜨는 것"인데 폰트를
      기다리면 그 자리에서 또 백지다. 이미지도 없다(요청 하나가 더 늘고, 그
      요청이 늦으면 마찬가지다).
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #fdf8f3;
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
      color: #143a57;
      z-index: 2147483000;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: #f28c26;
    }
    #boot .mark { margin: 0; }
    #boot .tagline {
      margin: 0;
      font-size: .875rem;
      opacity: .75;
    }
    #boot .sub { font-size: .8125rem; opacity: .65; margin: 0; }

    /*
      소개글. 로딩 화면의 나머지와 같은 자리에 있지만, 글씨를 한 단계 낮춰
      기다리는 사람의 눈을 방해하지 않게 둔다. 작은 화면에서는 목록만 남긴다.
    */
    #boot .about {
      max-width: 30rem;
      padding: 0 1.5rem;
      text-align: center;
      font-size: .8125rem;
      line-height: 1.7;
      opacity: .7;
    }
    #boot .about p { margin: 0 0 .5rem; }
    #boot .about ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    #boot .about li { white-space: nowrap; }
    #boot .about b { font-weight: 700; color: #f28c26; }
    @media (max-height: 560px) {
      #boot .about p { display: none; }
    }
    #boot .bar {
      position: relative;
      width: min(13rem, 55vw);
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(20, 58, 87, .12);
    }
    /* 진행률을 알 수 없으니(브라우저가 안 알려 준다) 흐르는 막대로 둔다.
       가짜 퍼센트를 그리는 것보다 정직하다. */
    #boot .bar::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: inherit;
      background: #f28c26;
      animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(255%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <!--
    로딩 화면이 이 페이지의 본문이다.

    게임 화면은 Flutter 가 캔버스에 그리므로 크롤러가 읽을 글이 한 줄도 없다.
    예전에는 그래서 1px 로 잘라낸 div 에 소개글을 숨겨 뒀는데, 그건 검색엔진이
    숨긴 텍스트로 보고 깎는 바로 그 모양이다 — 하필 이 사이트의 유일한 본문이
    그것이었다.

    그래서 같은 내용을 부팅 중에 "실제로 보이는" 자리로 옮겼다. 사용자는
    기다리는 동안 이 게임이 뭔지 읽고, 크롤러는 자바스크립트를 안 돌려도 같은
    글을 읽는다(네이버 Yeti 가 그렇다). 숨기는 것도, 크롤러에게만 다른 걸
    보여주는 것도 아니다.
  -->
  <div id="boot">
    <h1 class="mark">티츄 온라인</h1>
    <p class="tagline">티츄 · 마이티 · 스컬킹 · 러브레터를 친구들과 온라인으로</p>
    <div class="bar"></div>
    <p class="sub">불러오는 중…</p>

    <div class="about">
      <p>
        설치 없이 브라우저에서 바로 시작하는 멀티플레이 카드게임입니다.
        안드로이드와 iOS 앱도 있고, 랭크전 · 봇 대전 · 관전 · 채팅을
        지원합니다.
      </p>
      <ul>
        <li><b>티츄</b> — 4인 2:2 팀 카드게임</li>
        <li><b>마이티</b> — 5~6인 트릭테이킹 카드게임</li>
        <li><b>스컬킹</b> — 최대 6인 예측 트릭테이킹 게임</li>
        <li><b>러브레터</b> — 2~4인 추리 카드게임</li>
      </ul>
    </div>
  </div>

  <script>
    // 첫 프레임이 그려지면 로딩 화면을 걷는다. Flutter 가 flutter-first-frame
    // 을 쏴 준다 — 엔진이 실제로 무언가를 그린 시점이라, 타이머로 짐작하는
    // 것과 달리 이르지도 늦지도 않다.
    //
    // 안전장치로 20초를 건다. 부팅이 실패해도 로딩 화면이 영원히 덮고 있으면
    // 그 아래 있을지 모를 오류 화면조차 못 본다.
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var gone = false;
      function dismiss() {
        if (gone) return;
        gone = true;
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', dismiss);
      setTimeout(dismiss, 20000);
    })();
  </script>

  <script>
    // Built with --pwa-strategy=none, but a browser that visited an earlier
    // build still has that service worker registered and will keep serving its
    // cached bundle — which looks exactly like "the fix didn't deploy". Drop
    // any registration and its caches once, on load.
    //
    // Offline play is not a goal here: every screen needs the WebSocket, so a
    // cached shell would only ever show a disconnected app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <!-- Visible only when the app cannot run (crawlers, JS disabled). Flutter
       replaces the body content once it boots, so this never shows to a real
       player. -->
  <noscript>
    <div style="max-width:38rem;margin:3rem auto;padding:0 1.5rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.7;color:#143a57">
      <h1>Tichu Online</h1>
      <p>티츄, 마이티, 스컬킹, 러브레터를 함께 즐기는 멀티플레이 카드게임입니다.
         브라우저에서 바로 플레이하려면 자바스크립트를 켜주세요.</p>
      <p>
        <a href="https://play.google.com/store/apps/details?id=com.jiny.tichuOnline">Google Play</a> ·
        <a href="https://apps.apple.com/app/tichu-online/id6759035151">App Store</a>
      </p>
    </div>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
