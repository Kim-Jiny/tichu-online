name: tichu

# Two app slots (blue/green) sit behind the shared nginx proxy on
# `app-network`. nginx routes by container DNS name, so neither slot
# needs a host port binding — they just expose port 3000 inside the
# docker network. Profiles control which slot starts:
#   docker compose --profile blue up -d   # start blue only
#   docker compose --profile green up -d  # start green only
# During deploys both run briefly while traffic switches. db has no
# profile and always runs (shared singleton).

x-server-common: &server-common
  build: ./server
  image: tichu-server:latest
  restart: unless-stopped
  # Resource policy for the shared 4-vCPU / 8GB Contabo box. tichu is the
  # MAIN app (most users), co-hosting ~18 mostly-idle side projects.
  #  - BOT_WORKERS=2 (set per-slot env below) caps concurrent bot searches so
  #    the main event loop always keeps a free core -> WS heartbeat / human
  #    input never stall even under full bot load. This is the guarantee we
  #    protect above all; 2 workers << 4 cores. (Raise to 3 only on a
  #    dedicated host — on 4 shared cores it would starve tichu's own libuv/GC.)
  #  - cpu_shares 4096 (4x default) makes tichu win CPU over the side projects
  #    when the box is contended.
  #  - cpus/mem_limit are runaway ceilings, generous because tichu is priority.
  cpu_shares: 4096
  cpus: 3.5
  mem_limit: 2g
  # SIGTERM grace window. Long-running games on the outgoing slot get
  # up to 10 minutes to finish (or migrate via /internal/adopt-rooms)
  # before docker SIGKILL.
  stop_grace_period: 10m
  depends_on:
    db:
      condition: service_healthy
  dns:
    - 8.8.8.8
    - 8.8.4.4
  networks:
    - app-network

services:
  server-blue:
    <<: *server-common
    container_name: tichu-online-blue
    profiles: ["blue"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_NAME=blue
      - BOT_WORKERS=2
      - PEER_URL=http://tichu-online-green:3000
      - INTERNAL_MIGRATE_TOKEN=${INTERNAL_MIGRATE_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - ANDROID_APP_SHA256_FINGERPRINTS=${ANDROID_APP_SHA256_FINGERPRINTS}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME}
      - GOOGLE_PLAY_SA_EMAIL=${GOOGLE_PLAY_SA_EMAIL}
      - GOOGLE_PLAY_SA_PRIVATE_KEY=${GOOGLE_PLAY_SA_PRIVATE_KEY}
      - APPLE_ASC_KEY_ID=${APPLE_ASC_KEY_ID}
      - APPLE_ASC_ISSUER_ID=${APPLE_ASC_ISSUER_ID}
      - APPLE_ASC_PRIVATE_KEY=${APPLE_ASC_PRIVATE_KEY}

  server-green:
    <<: *server-common
    container_name: tichu-online-green
    profiles: ["green"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_NAME=green
      - BOT_WORKERS=2
      - PEER_URL=http://tichu-online-blue:3000
      - INTERNAL_MIGRATE_TOKEN=${INTERNAL_MIGRATE_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT}
      - ANDROID_APP_SHA256_FINGERPRINTS=${ANDROID_APP_SHA256_FINGERPRINTS}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME}
      - GOOGLE_PLAY_SA_EMAIL=${GOOGLE_PLAY_SA_EMAIL}
      - GOOGLE_PLAY_SA_PRIVATE_KEY=${GOOGLE_PLAY_SA_PRIVATE_KEY}
      - APPLE_ASC_KEY_ID=${APPLE_ASC_KEY_ID}
      - APPLE_ASC_ISSUER_ID=${APPLE_ASC_ISSUER_ID}
      - APPLE_ASC_PRIVATE_KEY=${APPLE_ASC_PRIVATE_KEY}

  db:
    image: postgres:16-alpine
    container_name: tichu-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      - POSTGRES_DB=tichu
      - POSTGRES_USER=tichu
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tichu"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # Object storage for user-uploaded profile photos. Gated behind the
  # `storage` profile so it never auto-starts during deploy.sh runs —
  # only `docker compose --profile storage up -d minio` brings it up.
  #
  # Mirrors the hmlove-minio pattern on this VPS: API (9000) stays on
  # the docker network only (server-blue/green access via
  # http://tichu-minio:9000). Public read traffic for profile photos
  # goes through nginx on the media path. Console (9001) is bound to
  # 127.0.0.1:59003 so admin can reach it via SSH tunnel without
  # exposing it to the public.
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: tichu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      - "127.0.0.1:59003:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  pgdata:
  minio_data:

networks:
  app-network:
    external: true
